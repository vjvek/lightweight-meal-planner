<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <h1 class="mb-4">Lightweight-Meal-Planner</h1>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#createMeal">Create a Meal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#mealplanner">Meal Planner</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#mealViewer">View All Meals</a>
                </li>
            </ul>
            
            <!-- Tab panes -->
            <div class="tab-content">
                <div id="createMeal" class="container tab-pane active"><br>
                    <h3>Create a Meal</h3>
                    <p>Create a meal or edit an existing one.</p>
                    <div class="row">
                        <div class="col">
                            <form id="createMealForm">
                                <div class="form-group">
                                    <div class="row">
                                        <div class="col-4">
                                            <input type="text" class="form-control" id="recipeName" placeholder="Meal Name" required>
                                            <input type="text" class="form-control" id="region" placeholder="Region" required>
                                            <select name="course" id="course" class="form-select" required>
                                                <option value="" disabled selected>Course</option>
                                                <option value="starter">Starter</option>
                                                <option value="main">Main</option>
                                                <option value="dessert">Dessert</option>
                                            </select>
                                            <select name="serving" id="serving" class="form-select" required>
                                                <option value="" disabled selected>Serving Size</option>
                                            </select>
                                        </div>
                                        <div class="col-8">
                                            <textarea name="description" id="description" placeholder="Add a description here eg. the recipe steps"></textarea>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="row d-flex align-items-center">
                                        <div class="col-auto">
                                            <h4>Add new ingredient</h4>
                                        </div>
                                        <div class="col-auto">
                                            <button type="button" class="btn btn-primary">Add Ingredient</button>
                                        </div>
                                    </div>
                                    <div id="ingredients">
                                        <div class="row">
                                            <div class="col-4">
                                                <input type="text" class="form-control" id="ingr_name" placeholder="Ingredient Name" required>
                                            </div>
                                            <div class="col-4">
                                                <input type="text" class="form-control" id="quantity" placeholder="Quantity">
                                            </div>
                                            <div class="col-4">
                                                <select name="unit" id="unit" class="form-select">
                                                    <option value="" disabled selected>Unit</option>
                                                    <option value="grams">Grams (g)</option>
                                                    <option value="kilograms">Millilitres (ml)</option> 
                                                    <option value="Teaspoon">Teaspoon (tsp)</option>
                                                    <option value="Tablespoon">Tablespoon (tbsp)</option>
                                                    <option value="Cups">Cups</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <hr>
                                    <div>
                                        <button type="button" class="btn btn-primary">Save Recipe</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div id="mealplanner" class="container tab-pane fade"><br>
                    <h3>Plan your Meals</h3>
                </div>
                <div id="mealViewer" class="container tab-pane fade"><br>
                    <h3>View Meals</h3>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
        <script src="script.js"></script>
        <script>
            $(document).ready(() => {
                addServingOptions(12);
            });
        </script>
    </body>
</html>
