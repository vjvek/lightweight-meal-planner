<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Meal Planner</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <h1 class="mb-4">Meal Planner</h1>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#createMeal">Create a Meal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#mealplanner">Meal Planner</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#mealViewer">View All Meals</a>
                </li>
            </ul>
            
            <!-- Create a Meal -->
            <div class="tab-content">
                <div id="createMeal" class="container tab-pane active"><br>
                    <div class="row">
                        <h3>Create a Meal</h3>
                        <p>Create a meal or edit an existing one using the dropdown list below.</p>
                        <div class="col-4">
                            <select name="editMeals" id="editMeals" class="form-select" onchange="editMeal()">
                                <option value="" disabled selected>Edit a Meal</option>
                            </select>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col">
                            <form id="createMealForm">
                                <div class="form-group">
                                    <div class="row">
                                        <div class="col-4">
                                            <input type="hidden" id="mealId" name="mealId">
                                            <input type="text" class="form-control" id="mealName" name="name" placeholder="Meal Name" required>
                                            <input type="text" class="form-control" id="region" name="region" placeholder="Region" required>
                                            <select name="course" id="course" class="form-select" required>
                                                <option value="" disabled selected>Course</option>
                                                <option value="starter">Starter</option>
                                                <option value="main">Main</option>
                                                <option value="dessert">Dessert</option>
                                                <option value="condiment">Condiment</option>
                                                <option value="other">Other</option>
                                            </select>
                                            <select name="serving" id="serving" class="form-select" required>
                                                <option value="" disabled selected>Serving Size</option>
                                            </select>
                                        </div>
                                        <div class="col-8">
                                            <textarea name="description" id="description" placeholder="Add a description here eg. the recipe steps"></textarea>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="row d-flex align-items-center">
                                        <div class="col-auto">
                                            <h4>Add the ingredients</h4>
                                        </div>
                                        <div class="col-auto">
                                            <button type="button" class="btn btn-primary" onclick="addNewIngredient(1)">Add Another Ingredient</button>
                                            <button type="button" class="btn btn-danger" onclick="deleteIngredient()">Delete Selected</button>
                                        </div>
                                    </div>
                                    <div id="ingredients"></div>
                                    <hr>
                                    <div id="formBtns">
                                        <button type="button" id="saveBtn" class="btn btn-primary" onclick="saveMeal()">Save Meal</button>
                                        <button type="button" class="btn btn-warning" onclick="resetForm()">Reset Form</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Meal Planner -->
                <div id="mealplanner" class="container tab-pane fade"><br>
                    <h3>Plan your Meals</h3>
                </div>
                <!-- View Meals -->
                <div id="mealViewer" class="container tab-pane fade"><br>
                    <h3>View Meals</h3>
                    <div class="row">
                        <div id="mealsView" class="col"></div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <div class="row">
                                <div id="detailHeading" class="col d-flex justify-content-between"></div>
                            </div>
                            <div class="row">
                                <div id="detailIngredients" class="col"></div>
                            </div>
                            <div class="row">
                                <div id="detailDescription" class="col"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
        <script src="script.js"></script>
        <script>
            $(document).ready(() => {
                addServingOptions(12);
                addNewIngredient(1);
                updateApp();
            });
        </script>
    </body>
</html>
